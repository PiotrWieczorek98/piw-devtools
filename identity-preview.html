<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>PIW identity preview</title>
        <link
            rel="stylesheet"
            href="https://fonts.bunny.net/css?family=instrument-sans:400,500"
        />
        <style>
            :root {
                --bg: #e8e5de;
                --card: #f4f2ed;
                --field: #faf9f6;
                --raised: #e2ded6;
                --border: #d9d4ca;
                --input: #cdc7bb;
                --fg: #1f1b16;
                --muted: #6b6358;
                --accent: #b8164a;
                --green: #0f7a42;
                --pink: #b8164a;
                --ink: #1f1b16;
                /* Glyph inks for paper: deeper and more saturated than the UI accents so they read at low alpha. */
                --glyph-a: #006b3c;
                --glyph-b: #c8104f;
                --glyph-c: #1d4ed8;
                --glyph-alpha: 1;
                --mono:
                    ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace;
            }
            html.dark {
                --bg: #0a0a0a;
                --card: #141414;
                --field: #0f0f0f;
                --raised: #262626;
                --border: #262626;
                --input: #333;
                --fg: #fafafa;
                --muted: #a3a3a3;
                --accent: #f80651;
                --green: #09ed6a;
                --pink: #f80651;
                --ink: #fafafa;
                --glyph-a: #09ed6a;
                --glyph-b: #f80651;
                --glyph-c: #09ed6a;
                --glyph-alpha: 0.55;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                background: var(--bg);
                color: var(--fg);
                font:
                    14px/20px 'Instrument Sans',
                    system-ui,
                    sans-serif;
                -webkit-font-smoothing: antialiased;
            }
            #bg,
            #print {
                position: fixed;
                inset: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
            }
            .page {
                position: relative;
                min-height: 100vh;
                padding-bottom: 96px;
            }
            header {
                position: sticky;
                top: 0;
                z-index: 2;
                border-bottom: 1px solid var(--border);
                background: color-mix(in srgb, var(--card) 90%, transparent);
            }
            .bar {
                max-width: 1280px;
                margin: 0 auto;
                padding: 12px 16px;
                display: flex;
                align-items: center;
                gap: 24px;
            }
            .logo {
                display: flex;
                align-items: center;
                gap: 8px;
                height: 32px;
                font-weight: 500;
                font-size: 16px;
            }
            nav {
                display: flex;
                gap: 4px;
            }
            nav span {
                padding: 6px 12px;
                border-radius: 8px;
                color: var(--muted);
            }
            nav span.on {
                background: var(--raised);
                color: var(--fg);
            }
            .spacer {
                flex: 1;
            }
            main {
                max-width: 1280px;
                margin: 0 auto;
                padding: 24px 16px;
            }
            .card {
                background: color-mix(in srgb, var(--card) 92%, transparent);
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 24px;
                display: grid;
                gap: 32px;
            }
            .cols {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 16px;
            }
            .col {
                display: grid;
                gap: 8px;
                align-content: start;
            }
            .row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
                min-height: 32px;
            }
            label {
                font-weight: 500;
            }
            textarea {
                width: 100%;
                min-height: 300px;
                resize: vertical;
                border: 1px solid var(--input);
                border-radius: 8px;
                background: var(--field);
                color: var(--fg);
                padding: 12px;
                font: 13px/20px var(--mono);
                outline: none;
            }
            textarea:focus-visible,
            button:focus-visible {
                box-shadow: 0 0 0 3px
                    color-mix(in srgb, var(--accent) 35%, transparent);
                border-color: var(--accent);
            }
            button {
                font: inherit;
                cursor: pointer;
            }
            .btn {
                height: 32px;
                padding: 0 12px;
                border-radius: 8px;
                border: 1px solid var(--input);
                background: var(--field);
                color: var(--fg);
                transition: background-color 0.15s;
            }
            .btn:hover {
                background: var(--raised);
            }
            .btn.primary {
                background: var(--accent);
                border-color: var(--accent);
                color: #fff;
            }
            .status {
                font-size: 13px;
                min-height: 20px;
                color: var(--muted);
            }
            .status.bad {
                color: #dc2626;
            }
            html.dark .status.bad {
                color: #e5484d;
            }
            .status.good {
                color: var(--green);
            }
            h2 {
                margin: 0;
                font-size: 16px;
                font-weight: 500;
            }
            .sub {
                color: var(--muted);
                font-size: 13px;
            }
            .ids {
                display: grid;
                grid-template-columns: 224px 1fr;
                gap: 24px;
            }
            .ids ul {
                list-style: none;
                margin: 0;
                padding: 0;
                border: 1px solid var(--border);
                border-radius: 8px;
                background: var(--field);
            }
            .ids li {
                display: flex;
                justify-content: space-between;
                padding: 6px 12px;
                font: 13px/20px var(--mono);
            }
            .ids li + li {
                border-top: 1px solid var(--border);
            }

            /* Direction switcher: preview chrome, not part of the design. */
            .switch {
                position: fixed;
                z-index: 5;
                left: 50%;
                bottom: 16px;
                transform: translateX(-50%);
                display: flex;
                gap: 4px;
                padding: 4px;
                border-radius: 12px;
                background: #1f1b16;
                color: #f4f2ed;
                box-shadow: 0 8px 24px rgb(0 0 0 / 0.25);
            }
            .switch button {
                border: 0;
                background: transparent;
                color: inherit;
                padding: 8px 12px;
                border-radius: 8px;
                opacity: 0.7;
            }
            .switch button.on {
                background: #3a352e;
                opacity: 1;
            }
            .switch i {
                width: 1px;
                background: #3a352e;
                margin: 4px 4px;
            }

            /* 1. Glyphs */
            .logo-glyphs {
                font-family: var(--mono);
                font-size: 17px;
                letter-spacing: 0;
            }
            .logo-glyphs b {
                color: var(--accent);
                font-weight: 500;
            }
            .logo-glyphs small {
                font-family: 'Instrument Sans', sans-serif;
                font-size: 14px;
                color: var(--muted);
                margin-left: 4px;
            }

            /* 2. Stamp */
            .stamp {
                display: inline-grid;
                place-items: center;
                height: 30px;
                padding: 0 10px;
                border: 2px solid var(--accent);
                border-radius: 6px;
                color: var(--accent);
                font: 600 15px/1 var(--mono);
                letter-spacing: 0.12em;
                transform: rotate(-4deg);
                box-shadow:
                    inset 0 0 0 2px var(--card),
                    inset 0 0 0 3px var(--accent);
            }
            .stamped {
                animation: press 0.32s cubic-bezier(0.2, 0.8, 0.2, 1) both;
                display: inline-block;
            }
            @keyframes press {
                from {
                    transform: scale(1.25);
                    opacity: 0;
                }
                60% {
                    transform: scale(0.97);
                    opacity: 1;
                }
                to {
                    transform: scale(1);
                }
            }

            /* 3. Watcher */
            .eyes .pupil {
                transition: transform 0.12s ease-out;
            }
            .eyes .lid {
                transform-box: fill-box;
                transform-origin: top;
                transition: transform 0.2s ease-out;
                transform: scaleY(0);
            }
            .eyes.squint .lid {
                transform: scaleY(0.55);
            }
            .eyes .brow {
                transition: transform 0.2s ease-out;
                transform-box: fill-box;
                transform-origin: center;
            }
            .eyes.squint .brow {
                transform: translateY(3px);
            }
            .eyes.calm .brow {
                transform: translateY(-2px) rotate(0deg);
            }

            [data-only] {
                display: none !important;
            }
            html[data-dir='glyphs'] [data-only~='glyphs'],
            html[data-dir='stamp'] [data-only~='stamp'],
            html[data-dir='watcher'] [data-only~='watcher'] {
                display: revert !important;
            }
            @media (max-width: 760px) {
                .cols,
                .ids {
                    grid-template-columns: 1fr;
                }
                nav {
                    display: none;
                }
                .switch {
                    flex-wrap: wrap;
                    width: calc(100% - 32px);
                    justify-content: center;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                .stamped {
                    animation: none;
                }
            }
        </style>
    </head>
    <body>
        <canvas id="bg"></canvas>
        <svg id="print" aria-hidden="true"></svg>

        <div class="page">
            <header>
                <div class="bar">
                    <div class="logo">
                        <span data-only="glyphs" class="logo-glyphs"
                            ><b>{</b>piw<b>}</b><small>devtools</small></span
                        >
                        <span data-only="stamp" class="stamp">PIW</span>
                        <span data-only="stamp" style="margin-left: 4px"
                            >Devtools</span
                        >
                        <svg
                            data-only="watcher"
                            class="eyes"
                            id="eyes"
                            width="44"
                            height="28"
                            viewBox="0 0 44 28"
                            aria-hidden="true"
                        >
                            <rect
                                x="1"
                                y="2"
                                width="42"
                                height="24"
                                rx="7"
                                fill="var(--green)"
                            />
                            <g class="eye">
                                <circle
                                    cx="13"
                                    cy="15"
                                    r="7.5"
                                    fill="var(--card)"
                                />
                                <circle
                                    class="pupil"
                                    cx="13"
                                    cy="15"
                                    r="3.5"
                                    fill="var(--ink)"
                                />
                                <rect
                                    class="lid"
                                    x="5"
                                    y="7"
                                    width="16"
                                    height="16"
                                    fill="var(--green)"
                                />
                            </g>
                            <g class="eye">
                                <circle
                                    cx="31"
                                    cy="15"
                                    r="7.5"
                                    fill="var(--card)"
                                />
                                <circle
                                    class="pupil"
                                    cx="31"
                                    cy="15"
                                    r="3.5"
                                    fill="var(--ink)"
                                />
                                <rect
                                    class="lid"
                                    x="23"
                                    y="7"
                                    width="16"
                                    height="16"
                                    fill="var(--green)"
                                />
                            </g>
                            <path
                                class="brow"
                                d="M6 6 L19 9 M38 6 L25 9"
                                stroke="var(--ink)"
                                stroke-width="2.5"
                                stroke-linecap="round"
                            />
                        </svg>
                        <span data-only="watcher">PIW Devtools</span>
                    </div>
                    <nav>
                        <span class="on">JSON formatter</span
                        ><span>PHP ⇄ JSON</span><span>Base64</span
                        ><span>PESEL &amp; NIP</span>
                    </nav>
                    <div class="spacer"></div>
                </div>
            </header>
            <main>
                <div class="card">
                    <div class="cols">
                        <div class="col">
                            <div class="row">
                                <label for="in">Input</label
                                ><button class="btn" id="clear">Clear</button>
                            </div>
                            <textarea id="in" spellcheck="false">
{"company":"Comarch S.A.","nip":"6770065406","regon":"350527377","active":true,"tags":["erp","krakow"]}</textarea>
                            <div class="status" id="status"></div>
                        </div>
                        <div class="col">
                            <div class="row">
                                <label for="out">Output</label
                                ><button class="btn">Copy</button>
                            </div>
                            <textarea
                                id="out"
                                readonly
                                spellcheck="false"
                            ></textarea>
                        </div>
                    </div>
                    <div class="ids">
                        <div class="col">
                            <h2>PESEL</h2>
                            <div class="sub">
                                Random numbers with a valid checksum
                            </div>
                            <div style="margin-top: 8px">
                                <button class="btn primary" id="gen">
                                    Generate
                                </button>
                            </div>
                        </div>
                        <ul id="pesels"></ul>
                    </div>
                </div>
            </main>
        </div>

        <div class="switch" role="toolbar" aria-label="Preview controls">
            <button data-dir="glyphs">1 · Data glyphs</button>
            <button data-dir="stamp">2 · Security print</button>
            <button data-dir="watcher">3 · Watcher</button>
            <i></i>
            <button id="theme">Dark</button>
        </div>

        <script>
            const root = document.documentElement;
            const css = (name) =>
                getComputedStyle(root).getPropertyValue(name).trim();

            /* ---------- JSON tool ---------- */
            const input = document.getElementById('in'),
                output = document.getElementById('out'),
                status = document.getElementById('status');
            let jsonValid = true;
            function format() {
                const text = input.value.trim();
                if (!text) {
                    output.value = '';
                    status.textContent = '';
                    status.className = 'status';
                    jsonValid = null;
                    updateEyes();
                    return;
                }
                try {
                    output.value = JSON.stringify(JSON.parse(text), null, 2);
                    status.textContent = 'Valid JSON';
                    status.className = 'status good';
                    jsonValid = true;
                } catch (e) {
                    output.value = '';
                    status.textContent = 'Invalid JSON: ' + e.message;
                    status.className = 'status bad';
                    jsonValid = false;
                }
                updateEyes();
            }
            input.addEventListener('input', format);
            document.getElementById('clear').onclick = () => {
                input.value = '';
                format();
                input.focus();
            };

            /* ---------- PESEL with a real checksum ---------- */
            function pesel() {
                const y = 1950 + Math.floor(Math.random() * 60),
                    m = 1 + Math.floor(Math.random() * 12),
                    d = 1 + Math.floor(Math.random() * 28);
                const mm = y >= 2000 ? m + 20 : m;
                const p = (n) => String(n).padStart(2, '0');
                let digits =
                    p(y % 100) +
                    p(mm) +
                    p(d) +
                    String(Math.floor(Math.random() * 10000)).padStart(4, '0');
                const w = [1, 3, 7, 9, 1, 3, 7, 9, 1, 3];
                const sum = [...digits].reduce(
                    (s, c, i) => s + Number(c) * w[i],
                    0,
                );
                return digits + ((10 - (sum % 10)) % 10);
            }
            function generate() {
                const list = document.getElementById('pesels');
                list.innerHTML = '';
                for (let i = 0; i < 4; i++) {
                    const li = document.createElement('li');
                    const n = document.createElement('span');
                    n.textContent = pesel();
                    if (root.dataset.dir === 'stamp') {
                        n.className = 'stamped';
                        n.style.animationDelay = i * 60 + 'ms';
                    }
                    li.append(
                        n,
                        Object.assign(document.createElement('span'), {
                            textContent: 'Copy',
                            style: 'color:var(--muted);font-family:Instrument Sans',
                        }),
                    );
                    list.append(li);
                }
            }
            document.getElementById('gen').onclick = generate;

            /* ---------- 1. Glyph streams (canvas 2D, ~30fps) ---------- */
            const canvas = document.getElementById('bg'),
                ctx = canvas.getContext('2d');
            const chars = '{}[]:",01=/+QWxyz9a'.split('');
            let W = 0,
                H = 0,
                strands = [],
                glyphs = [],
                dots = [];
            function resize() {
                const r = Math.min(devicePixelRatio, 1.5);
                W = innerWidth;
                H = innerHeight;
                canvas.width = W * r;
                canvas.height = H * r;
                ctx.setTransform(r, 0, 0, r, 0, 0);
                strands = Array.from({ length: 14 }, (_, i) => ({
                    y: ((i + 0.5) / 14) * H,
                    amp: 20 + Math.random() * 50,
                    f: 0.002 + Math.random() * 0.003,
                    ph: Math.random() * 6,
                    speed: 18 + Math.random() * 30,
                    hue: ['a', 'b', 'a', 'c'][i % 4],
                }));
                glyphs = Array.from({ length: 520 }, () => ({
                    s: Math.floor(Math.random() * 14),
                    x: Math.random() * W,
                    c: chars[Math.floor(Math.random() * chars.length)],
                    a: 0.25 + Math.random() * 0.75,
                    size: 11 + Math.floor(Math.random() * 3) * 2,
                }));
                dots = Array.from({ length: 220 }, () => ({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    vx: 4 + Math.random() * 8,
                    vy: (Math.random() - 0.5) * 3,
                    r: 0.6 + Math.random() * 1.4,
                    hue: Math.random() < 0.35 ? 'pink' : 'green',
                    a: 0.2 + Math.random() * 0.5,
                }));
            }
            function drawGlyphs(t, dt) {
                const col = {
                    a: css('--glyph-a'),
                    b: css('--glyph-b'),
                    c: css('--glyph-c'),
                };
                const strength = Number(css('--glyph-alpha'));
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                for (const g of glyphs) {
                    const s = strands[g.s];
                    g.x += s.speed * dt;
                    if (g.x > W + 20) {
                        g.x = -20;
                        g.c = chars[Math.floor(Math.random() * chars.length)];
                    }
                    const y =
                        s.y +
                        Math.sin(g.x * s.f + t * 0.3 + s.ph) * s.amp +
                        Math.sin(g.x * s.f * 2.7 + t * 0.2) * s.amp * 0.3;
                    const edge = Math.min(1, g.x / 120, (W - g.x) / 120);
                    ctx.globalAlpha = Math.max(0, edge) * g.a * strength;
                    ctx.fillStyle = col[s.hue];
                    ctx.font = g.size + 'px ' + css('--mono');
                    ctx.fillText(g.c, g.x, y);
                }
            }
            function drawDots(t, dt) {
                const col = { green: css('--green'), pink: css('--pink') };
                for (const d of dots) {
                    d.x += d.vx * dt;
                    d.y += d.vy * dt + Math.sin(t * 0.4 + d.x * 0.01) * 0.1;
                    if (d.x > W + 5) {
                        d.x = -5;
                        d.y = Math.random() * H;
                    }
                    ctx.globalAlpha =
                        d.a * (root.classList.contains('dark') ? 0.8 : 0.55);
                    ctx.fillStyle = col[d.hue];
                    ctx.beginPath();
                    ctx.arc(d.x, d.y, d.r, 0, 7);
                    ctx.fill();
                }
            }
            let last = performance.now(),
                frame = 0,
                acc = 0;
            function loop(now) {
                frame = requestAnimationFrame(loop);
                acc += now - last;
                if (acc < 33) {
                    last = now;
                    return;
                } // cap ~30fps
                const dt = Math.min(acc / 1000, 0.1);
                acc = 0;
                last = now;
                ctx.clearRect(0, 0, W, H);
                if (root.dataset.dir === 'glyphs') {
                    drawGlyphs(now / 1000, dt);
                }
                if (root.dataset.dir === 'watcher') {
                    drawDots(now / 1000, dt);
                }
                ctx.globalAlpha = 1;
            }
            document.addEventListener('visibilitychange', () => {
                cancelAnimationFrame(frame);
                if (!document.hidden) {
                    last = performance.now();
                    frame = requestAnimationFrame(loop);
                }
            });

            /* ---------- 2. Guilloche (static SVG, drawn once per resize/theme) ---------- */
            function drawGuilloche() {
                const svg = document.getElementById('print');
                if (root.dataset.dir !== 'stamp') {
                    svg.innerHTML = '';
                    return;
                }
                const w = innerWidth,
                    h = innerHeight,
                    dark = root.classList.contains('dark');
                let paths = '';
                const bands = [h * 0.18, h * 0.5, h * 0.82];
                bands.forEach((cy, b) => {
                    for (let i = 0; i < 18; i++) {
                        let d = '';
                        for (let x = -10; x <= w + 10; x += 6) {
                            const y =
                                cy +
                                Math.sin(x * 0.012 + i * 0.35) * 28 +
                                Math.sin(x * 0.031 - i * 0.6 + b) * 12 +
                                Math.cos(x * 0.005 + i * 0.2) * 18;
                            d +=
                                (x === -10 ? 'M' : 'L') +
                                x +
                                ' ' +
                                y.toFixed(1);
                        }
                        const color = b === 1 ? css('--pink') : css('--green');
                        paths += `<path d="${d}" fill="none" stroke="${color}" stroke-width=".7" opacity="${dark ? 0.28 : 0.22}"/>`;
                    }
                });
                svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
                svg.innerHTML = paths;
            }

            /* ---------- 3. Watcher eyes ---------- */
            const eyes = document.getElementById('eyes');
            function updateEyes() {
                eyes.classList.toggle('squint', jsonValid === false);
                eyes.classList.toggle('calm', jsonValid === true);
            }
            addEventListener('pointermove', (e) => {
                if (root.dataset.dir !== 'watcher') {
                    return;
                }
                eyes.querySelectorAll('.eye').forEach((eye) => {
                    const r = eye.getBoundingClientRect();
                    const dx = e.clientX - (r.left + r.width / 2),
                        dy = e.clientY - (r.top + r.height / 2);
                    const dist = Math.hypot(dx, dy) || 1,
                        k = Math.min(3.2, dist / 40);
                    eye.querySelector('.pupil').style.transform =
                        `translate(${(dx / dist) * k}px, ${(dy / dist) * k}px)`;
                });
            });

            /* ---------- Switching ---------- */
            function setDir(dir) {
                root.dataset.dir = dir;
                document
                    .querySelectorAll('.switch [data-dir]')
                    .forEach((b) =>
                        b.classList.toggle('on', b.dataset.dir === dir),
                    );
                try {
                    history.replaceState(
                        null,
                        '',
                        '#' +
                            dir +
                            (root.classList.contains('dark') ? '-dark' : ''),
                    );
                } catch {}
                drawGuilloche();
                generate();
            }
            document
                .querySelectorAll('.switch [data-dir]')
                .forEach((b) => (b.onclick = () => setDir(b.dataset.dir)));
            const themeBtn = document.getElementById('theme');
            themeBtn.onclick = () => {
                root.classList.toggle('dark');
                themeBtn.textContent = root.classList.contains('dark')
                    ? 'Light'
                    : 'Dark';
                setDir(root.dataset.dir);
            };
            addEventListener('resize', () => {
                resize();
                drawGuilloche();
            });

            const [hashDir, hashTheme] = location.hash.slice(1).split('-');
            if (hashTheme === 'dark') {
                root.classList.add('dark');
                themeBtn.textContent = 'Light';
            }
            resize();
            format();
            setDir(
                ['glyphs', 'stamp', 'watcher'].includes(hashDir)
                    ? hashDir
                    : 'glyphs',
            );
            frame = requestAnimationFrame(loop);
        </script>
    </body>
</html>
